name: Tests

on: [push, pull_request]

jobs:
  Windows:
    runs-on: windows-latest
    strategy:
      fail-fast: true
    name: Windows
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install deps
      run: |
        git clone https://github.com/madler/zlib.git
        cmake -S zlib -B zlib-build -DZLIB_BUILD_MINIZIP=ON -DMINIZIP_ENABLE_BZIP2=OFF -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install
        cmake --build zlib-build -v --config Release
        cmake --install zlib-build --config Release
        git clone https://github.com/libexpat/libexpat.git
        cd libexpat
        # Pinned master commit: all releases up to R_2_7_3 detect arc4random_buf()
        # in GNU mode but compile with -std=c99, where newlib/BSD headers hide the
        # declaration; GCC >= 14 turns that into a hard error (broke the Cygwin
        # job). Master isolates the entropy code with proper feature-test macros.
        # Switch back to a release tag once one containing this rework is out.
        git checkout b68595d07cc869af802964709dea6b232d39e56e
        cd ..
        cmake -S libexpat/expat -B expat-build -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install
        cmake --build expat-build --config Release
        cmake --install expat-build --config Release
        git clone https://github.com/google/googletest.git
        cmake -S googletest -B gtest-build -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install -Dgtest_force_shared_crt=ON
        cmake --build gtest-build --config Release
        cmake --install gtest-build --config Release
        git clone https://github.com/uriparser/uriparser.git
        cd uriparser
        git checkout uriparser-0.9.8
        cd ..
        cmake -S uriparser -B uriparser-build -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install -DURIPARSER_BUILD_DOCS=OFF -DURIPARSER_BUILD_TESTS=OFF
        cmake --build uriparser-build --config Release
        cmake --install uriparser-build --config Release
        git clone https://github.com/curl/curl.git
        cd curl
        git checkout curl-8_10_1
        cd ..
        cmake -S curl -B curl-build -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install
        cmake --build curl-build --config Release
        cmake --install curl-build --config Release
    - name: Configure
      run: |
        cmake -S . -B build -DLibKML_BUILD_TESTING=ON -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install -DLibKML_BUILD_TESTING=ON
    - name: Build
      run: cmake --build build --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir build -C Release

  Linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    name: Linux
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Deps
      run: |
        sudo apt install libbz2-dev liburiparser-dev googletest
        git clone https://github.com/madler/zlib.git
        cmake -S zlib -B zlib-build -DCMAKE_BUILD_TYPE=Release -DZLIB_BUILD_MINIZIP=ON
        cmake --build zlib-build
        sudo cmake --install zlib-build
        git clone https://github.com/google/googletest.git
        cmake -S googletest -B gtest-build -DCMAKE_BUILD_TYPE=Release
        cmake --build gtest-build
        sudo cmake --install gtest-build
    - name: Configure
      run: >
        cmake -S . \
          -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DLibKML_BUILD_TESTING=ON
    - name: Build
      run: cmake --build build --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir build -C Release

  Mac:
    runs-on: macos-latest
    strategy:
      fail-fast: true
    name: Mac
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install deps
      run: |
        git clone https://github.com/madler/zlib.git
        cmake -S zlib \
          -B zlib-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=OFF \
          -DCMAKE_INSTALL_PREFIX=/Users/runner/Install
        cmake --build zlib-build
        cmake --install zlib-build
        git clone https://github.com/libexpat/libexpat.git
        cd libexpat
        # Pinned master commit, see comment in the Windows job.
        git checkout b68595d07cc869af802964709dea6b232d39e56e
        cd ..
        cmake -S libexpat/expat \
          -B expat-build \
          -DCMAKE_INSTALL_PREFIX=/Users/runner/Install
        cmake --build expat-build
        cmake --install expat-build
        git clone https://github.com/google/googletest.git
        cmake -S googletest \
          -B gtest-build \
          -DCMAKE_INSTALL_PREFIX=/Users/runner/Install
        cmake --build gtest-build
        cmake --install gtest-build
        git clone https://github.com/uriparser/uriparser.git
        cd uriparser
        git checkout uriparser-0.9.8
        cd ..
        cmake -S uriparser \
          -B uriparser-build \
          -DCMAKE_INSTALL_PREFIX=/Users/runner/Install \
          -DURIPARSER_BUILD_DOCS=OFF
        cmake --build uriparser-build
        cmake --install uriparser-build
    - name: Configure
      run: >
        cmake -S . \
          -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/Users/runner/Install \
          -DLibKML_BUILD_TESTING=ON
    - name: Build
      run: cmake --build build --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir build -C Release

  MSys:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        sys: [mingw32, mingw64, ucrt64, clang64]
    name: MSys - ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          make
          git
        pacboy: >-
          toolchain:p
          cmake:p
    - name: Install deps
      run: |
        if [ ${MSYSTEM} == CLANG64 ]
        then
          export CC=clang
          export CXX=clang++
        fi
        git clone https://github.com/madler/zlib.git
        cmake -S zlib \
          -B zlib-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=OFF \
          -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install
        cmake --build zlib-build
        cmake --install zlib-build
        git clone https://github.com/google/googletest.git
        cmake -S googletest \
          -B gtest-build \
          -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install
        cmake --build gtest-build
        cmake --install gtest-build
        git clone https://github.com/uriparser/uriparser.git
        cd uriparser
        git checkout uriparser-0.9.8
        cd ..
        cmake -S uriparser \
          -B uriparser-build \
          -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install \
          -DURIPARSER_BUILD_DOCS=OFF
        cmake --build uriparser-build
        cmake --install uriparser-build
    - name: Configure
      run: |
        if [ ${MSYSTEM} == CLANG64 ]
        then
          export CC=clang
          export CXX=clang++
        fi
        cmake -G"Unix Makefiles" \
          -S . \
          -B build \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=D:/a/libkml/Install \
          -DLibKML_BUILD_TESTING=ON
    - name: Build
      run: cmake --build build --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir build -C Release

  cygwin:
    strategy:
      fail-fast: true
    runs-on: windows-latest
    defaults:
      run:
        # -e so a failing dependency build stops the step right there instead of
        # surfacing later as a missing package at configure time.
        shell: C:\cygwin\bin\bash.exe --login -o igncr -eo pipefail '{0}'
    name: Cygwin
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: >-
          cmake
          cygwin-devel
          gcc-core
          gcc-g++
          ninja
    - name: Install deps
      run: |
        git clone https://github.com/madler/zlib.git
        cmake -S zlib \
          -GNinja \
          -B zlib-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DZLIB_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=OFF
        cmake --build zlib-build -v -j1
        cmake --install zlib-build
        git clone https://github.com/libexpat/libexpat.git
        cd libexpat
        # Pinned master commit, see comment in the Windows job. Cygwin is where
        # the release versions actually break (GCC >= 14 + newlib).
        git checkout b68595d07cc869af802964709dea6b232d39e56e
        cd ..
        cmake -S libexpat/expat \
          -B expat-build \
          -G Ninja
        cmake --build expat-build
        cmake --install expat-build
        git clone https://github.com/google/googletest.git
        cmake -S googletest \
          -B gtest-build \
          -G Ninja
        cmake --build gtest-build
        cmake --install gtest-build
        git clone https://github.com/uriparser/uriparser.git
        cd uriparser
        git checkout uriparser-0.9.8
        cd ..
        cmake -S uriparser \
          -B uriparser-build \
          -DURIPARSER_BUILD_DOCS=OFF \
          -G Ninja
        cmake --build uriparser-build
        cmake --install uriparser-build
    - name: Configure
      run: >
        cmake -S /cygdrive/d/a/libkml/libkml \
          -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -G Ninja \
          -DLibKML_BUILD_TESTING=ON
    - name: Build
      run: cmake --build build --config Release -v
    - name: Run tests
      run: ctest --output-on-failure --test-dir build -C Release
